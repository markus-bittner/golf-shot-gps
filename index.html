<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Golf Shot GPS</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#007AFF">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}
#map{position:fixed;inset:0}
.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{pointer-events:auto;background:rgba(20,20,20,.82);color:white;border:0;border-radius:18px;padding:10px 14px;font-weight:700;backdrop-filter:blur(8px)}
#info{max-width:70%}
#locateBtn{position:fixed;z-index:1000;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 178px);width:52px;height:52px;border-radius:50%;padding:0;background:rgba(20,20,20,.86);color:#fff;font-size:25px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.bottom{position:fixed;z-index:1000;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font:inherit;border:0;border-radius:16px;padding:16px 10px;font-weight:800;font-size:16px}
button:disabled{opacity:.45}
#shot{grid-column:1/3;background:#fff;font-size:24px;padding:20px}
#next{background:#dedede}
#finish{background:#222;color:#fff}
#history{background:rgba(20,20,20,.82);color:#fff}
#undo{background:rgba(20,20,20,.82);color:#fff}
.panel{position:fixed;z-index:2000;inset:0;background:#f4f4f4;display:none;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.panel h2{margin-top:0}.card{background:white;border-radius:16px;padding:14px;margin:10px 0}.card button{width:100%;text-align:left;background:white;padding:0}.close{position:sticky;top:0;float:right;background:#222;color:#fff;padding:9px 13px}
.small{font-size:13px;color:#666;margin-top:5px}
.round-row{display:flex;align-items:center;gap:10px}
.round-open{flex:1}
.delete-round{width:auto!important;flex:0 0 auto!important;padding:10px 12px!important;border-radius:12px!important;color:#007AFF!important;font-weight:800!important;background:#f2f2f7!important;text-align:center!important}
.distance-label{background:#fff;border:0;border-radius:9px;padding:3px 6px;font-weight:800;box-shadow:0 1px 5px #555}
.current-crosshair{width:28px;height:28px;border:3px solid #007AFF;border-radius:50%;box-sizing:border-box;position:relative;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.current-crosshair:before,.current-crosshair:after{content:"";position:absolute;background:#007AFF;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.current-crosshair:before{width:3px;height:38px;left:10px;top:-8px}
.current-crosshair:after{height:3px;width:38px;top:10px;left:-8px}
.current-crosshair i{position:absolute;width:6px;height:6px;border-radius:50%;background:#111;left:8px;top:8px;z-index:2}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div id="info" class="pill">Loch 1 · bereit</div>
  <div style="display:flex;gap:7px">
    <button id="undo" class="pill">↶</button>
    <button id="history" class="pill">Runden</button>
  </div>
</div>
<button id="locateBtn" aria-label="Aktuelle Position anzeigen" title="Aktuelle Position">◎</button>
<div class="bottom">
  <button id="shot">START</button>
  <button id="next">NEXT HOLE</button>
  <button id="finish">FINISH</button>
</div>
<div id="panel" class="panel">
  <button id="closePanel" class="close">✕</button>
  <h2>Gespeicherte Runden</h2>
  <div id="rounds"></div>
  <button id="exportBtn">Export / Backup</button>
  <label style="display:block;margin-top:12px;background:white;border-radius:16px;padding:14px;font-weight:700">
    Import / Wiederherstellen
    <input id="importFile" type="file" accept="application/json" style="display:block;margin-top:8px">
  </label>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORAGE='golf-shot-gps-rounds-v1';
const DRAFT_STORAGE='golf-shot-gps-active-round-v1';
const POOR_ACCURACY_METERS=30;
let rounds=JSON.parse(localStorage.getItem(STORAGE)||'[]');
let round=null, viewedRound=null, hole=1, layers=[], capturePending=false;
let currentPosition=null, currentMarker=null, accuracyCircle=null;
const map=L.map('map',{zoomControl:false}).setView([47.37,8.2],16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
 maxZoom:20, attribution:'Tiles © Esri'
}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const info=document.getElementById('info'), shot=document.getElementById('shot');

function dist(a,b){
 const R=6371000, p=Math.PI/180, dlat=(b.lat-a.lat)*p, dlon=(b.lng-a.lng)*p;
 const x=Math.sin(dlat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dlon/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));
}

function locate(){
 if(!navigator.geolocation)return Promise.reject({code:0});
 return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(
  p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,time:Date.now()}),
  rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
}

function updateCurrentPosition(pos){
 currentPosition={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,time:Date.now()};
 const ll=[currentPosition.lat,currentPosition.lng];
 if(!currentMarker){
  const icon=L.divIcon({className:'',html:'<div class="current-crosshair"><i></i></div>',iconSize:[28,28],iconAnchor:[14,14]});
  currentMarker=L.marker(ll,{icon,interactive:false,zIndexOffset:1000}).addTo(map);
  accuracyCircle=L.circle(ll,{radius:currentPosition.accuracy,color:'#007AFF',weight:1,opacity:.8,fillColor:'#007AFF',fillOpacity:.10,interactive:false}).addTo(map);
 }else{
  currentMarker.setLatLng(ll);
  accuracyCircle.setLatLng(ll).setRadius(currentPosition.accuracy);
 }
}

function centerOnCurrent(){
 if(currentPosition){
  map.setView([currentPosition.lat,currentPosition.lng],18);
  return;
 }
 info.textContent='GPS…';
 locate().then(p=>{
  currentPosition=p;
  map.setView([p.lat,p.lng],18);
 }).catch(e=>{
  info.textContent=gpsErrorMessage(e);
 });
}

function marker(p,label){
 const m=L.circleMarker([p.lat,p.lng],{radius:7,weight:3,color:'#fff',fillColor:'#111',fillOpacity:1}).addTo(map);
 layers.push(m);
 if(label)m.bindTooltip(label,{permanent:true,direction:'top',className:'distance-label'});
}

function redraw(){
 layers.forEach(x=>map.removeLayer(x));
 layers=[];
 const displayedRound=viewedRound||round;
 if(!displayedRound)return;
 const all=[];
 displayedRound.holes.forEach(h=>{
  h.points.forEach((p,i)=>{all.push([p.lat,p.lng]);marker(p,i===0?'T'+h.number:'');});
  for(let i=1;i<h.points.length;i++){
   const a=h.points[i-1],b=h.points[i],d=Math.round(dist(a,b));
   const line=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{weight:4,color:'#007AFF'}).addTo(map);
   layers.push(line);
   const mid=[(a.lat+b.lat)/2,(a.lng+b.lng)/2];
   const lab=L.marker(mid,{icon:L.divIcon({className:'distance-label',html:d+' m',iconSize:null})}).addTo(map);
   layers.push(lab);
  }
 });
 if(all.length)map.fitBounds(all,{padding:[50,50],maxZoom:19});
}

function gpsErrorMessage(error){
 if(!navigator.geolocation||error&&error.code===0)return'GPS wird von diesem Gerät nicht unterstützt';
 if(error&&error.code===1)return'Standort nicht erlaubt – bitte in den Einstellungen freigeben';
 if(error&&error.code===2)return'GPS-Signal nicht verfügbar – bitte kurz warten';
 if(error&&error.code===3)return'GPS dauert zu lange – bitte erneut versuchen';
 return'GPS nicht verfügbar – Standortfreigabe prüfen';
}

function accuracyText(p){
 const accuracy=Math.round(p.accuracy);
 return p.accuracy>POOR_ACCURACY_METERS?`GPS ungenau · ±${accuracy} m`:`±${accuracy} m`;
}

function currentHole(){
 return round&&round.holes.find(x=>x.number===hole);
}

function updateControls(){
 const h=currentHole(), hasPoint=!!(h&&h.points.length);
 shot.disabled=capturePending||!!viewedRound;
 document.getElementById('undo').disabled=capturePending||!!viewedRound||!hasPoint;
 document.getElementById('next').disabled=capturePending||!!viewedRound||!hasPoint;
 document.getElementById('finish').disabled=capturePending||!!viewedRound||!round||!round.holes.some(x=>x.points.length);
}

function ensureRound(){
 if(!round)round={id:Date.now(),date:new Date().toISOString(),finished:false,holes:[{number:1,points:[]}]};
 let h=round.holes.find(x=>x.number===hole);
 if(!h){h={number:hole,points:[]};round.holes.push(h)}
 return h;
}

function saveDraft(){
 if(round&&!round.finished)localStorage.setItem(DRAFT_STORAGE,JSON.stringify({round,hole}));
}

function clearDraft(){
 localStorage.removeItem(DRAFT_STORAGE);
}

function restoreDraft(){
 const saved=JSON.parse(localStorage.getItem(DRAFT_STORAGE)||'null');
 if(!saved||!saved.round||saved.round.finished||!Array.isArray(saved.round.holes))return;
 round=saved.round;
 hole=Number(saved.hole)||round.holes[round.holes.length-1]?.number||1;
 const h=currentHole();
 shot.textContent=h&&h.points.length?'BALL':'START';
 info.textContent=`Loch ${hole} · Runde fortgesetzt`;
 redraw();
}

async function addPoint(){
 if(capturePending||viewedRound)return;
 capturePending=true;
 updateControls();
 try{
  info.textContent='GPS…';
  const p=await locate(),h=ensureRound();
  const prev=h.points[h.points.length-1];
  h.points.push(p);
  saveDraft();
  if(prev)info.textContent=`Loch ${hole} · ${Math.round(dist(prev,p))} m · ${accuracyText(p)}`;
  else info.textContent=`Loch ${hole} · Tee gespeichert · ${accuracyText(p)}`;
  shot.textContent='BALL';
  map.setView([p.lat,p.lng],18);
  redraw();
 }catch(e){
  info.textContent=gpsErrorMessage(e);
 }finally{
  capturePending=false;
  updateControls();
 }
}

document.getElementById('shot').onclick=addPoint;
document.getElementById('locateBtn').onclick=centerOnCurrent;

document.getElementById('next').onclick=()=>{
 if(capturePending||viewedRound)return;
 const h=currentHole();
 if(!h||!h.points.length)return;
 hole++;
 ensureRound();
 saveDraft();
 shot.textContent='START';
 info.textContent=`Loch ${hole} · bereit`;
 updateControls();
};

document.getElementById('finish').onclick=()=>{
 if(capturePending||viewedRound||!round||!round.holes.some(x=>x.points.length))return;
 round.finished=true;
 round.finishedAt=new Date().toISOString();
 rounds.unshift(round);
 localStorage.setItem(STORAGE,JSON.stringify(rounds));
 clearDraft();
 alert('Runde gespeichert.');
 round=null;
 viewedRound=null;
 hole=1;
 layers.forEach(x=>map.removeLayer(x));
 layers=[];
 shot.textContent='START';
 info.textContent='Loch 1 · bereit';
 updateControls();
};

document.getElementById('undo').onclick=()=>{
 if(capturePending||viewedRound)return;
 const h=currentHole();
 if(!h)return;
 if(h.points.length)h.points.pop();
 saveDraft();
 shot.textContent=h.points.length?'BALL':'START';
 info.textContent=`Loch ${hole} · letzter Punkt gelöscht`;
 redraw();
 updateControls();
};

function showRounds(){
 const box=document.getElementById('rounds');
 box.innerHTML='';
 if(!rounds.length)box.innerHTML='<p>Noch keine gespeicherten Runden.</p>';
 rounds.forEach(r=>{
  const n=r.holes.reduce((s,h)=>s+Math.max(0,h.points.length-1),0);
  const d=new Date(r.date).toLocaleString('de-CH');
  const el=document.createElement('div');
  el.className='card';
  el.innerHTML=`<div class="round-row"><button class="round-open"><b>${d}</b><div class="small">${r.holes.length} Loch · ${n} gemessene Schläge</div></button><button class="delete-round">Löschen</button></div>`;
  el.querySelector('.round-open').onclick=()=>{
   viewedRound=r;
   document.getElementById('panel').style.display='none';
   info.textContent='Gespeicherte Runde · nur ansehen';
   redraw();
   updateControls();
  };
  el.querySelector('.delete-round').onclick=()=>{
   if(!confirm('Diese Runde wirklich löschen?'))return;
   rounds=rounds.filter(x=>x.id!==r.id);
   localStorage.setItem(STORAGE,JSON.stringify(rounds));
   showRounds();
  };
  box.appendChild(el);
 });
 document.getElementById('panel').style.display='block';
}

document.getElementById('history').onclick=showRounds;
document.getElementById('closePanel').onclick=()=>{
 document.getElementById('panel').style.display='none';
 if(viewedRound){
  viewedRound=null;
  info.textContent=round?`Loch ${hole} · bereit`:'Loch 1 · bereit';
  shot.textContent=currentHole()&&currentHole().points.length?'BALL':'START';
  redraw();
  updateControls();
 }
};

document.getElementById('exportBtn').onclick=()=>{
 const blob=new Blob([JSON.stringify(rounds,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='golf-shot-gps-backup.json';
 a.click();
};

document.getElementById('importFile').onchange=async e=>{
 try{
  rounds=JSON.parse(await e.target.files[0].text());
  localStorage.setItem(STORAGE,JSON.stringify(rounds));
  showRounds();
 }catch(_){
  alert('Ungültige Backup-Datei');
 }
};

if(navigator.geolocation){
 navigator.geolocation.watchPosition(p=>{
  const first=!currentPosition;
  updateCurrentPosition(p);
  if(first)map.setView([p.coords.latitude,p.coords.longitude],18);
 },e=>{
  if(!currentPosition&&!capturePending)info.textContent=gpsErrorMessage(e);
 }, {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}else{
 info.textContent=gpsErrorMessage({code:0});
}
restoreDraft();
updateControls();
</script>
</body>
</html>
